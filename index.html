<style>
  :root { --ink: #eef0f0; --dim: rgba(238, 240, 240, .62); --faint: rgba(238, 240, 240, .3); --own: #d8e2ea; --foe: #ff6a4a; --sel: #9fe0ff; }

<div id="stage">

</div>
<div id="rotate"><b>⟳</b><p>横向きにしてください<br><i>Turn your device sideways</i></p></div>
<script>
  // the page is laid out at 1600 x 900 and scaled to the window; on a small screen (a phone on its side) the
  // panels are drawn larger (compact), and held upright it asks to be turned
  function fit() { const s = Math.min(innerWidth / 1600, innerHeight / 900), st = document.getElementById('stage');
    st.style.transform = `translate(-50%, -50%) scale(${s})`;
    const touch = matchMedia('(pointer: coarse)').matches;
    st.classList.toggle('compact', s < 0.62 || (touch && s < 0.9));
    document.body.classList.toggle('portrait', innerHeight > innerWidth && matchMedia('(pointer: coarse)').matches); }
  addEventListener('resize', fit); fit();
  const q = new URLSearchParams(location.search);
  if (q.has('clean') || q.has('render')) { for (const id of ['hud', 'ov']) document.getElementById(id).classList.add('hide'); document.getElementById('title').classList.add('gone'); document.getElementById('lang').style.display = 'none'; }
</script>
<script type="module" src="app.js"></script>
